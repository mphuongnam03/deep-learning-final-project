services:
  postgres:
    image: postgres:16
    container_name: tb_ai_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tb_ai_db}
      POSTGRES_USER: ${POSTGRES_USER:-tb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tb_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tb_user} -d ${POSTGRES_DB:-tb_ai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
